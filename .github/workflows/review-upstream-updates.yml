name: Review upstream Cap updates

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-review
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows/, which
      # upstream merges regularly do. UPSTREAM_SYNC_TOKEN is a fine-grained PAT
      # with Contents, Pull requests and Workflows (read and write) on this repo.
      - name: Require upstream sync token
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$UPSTREAM_SYNC_TOKEN" ]]; then
            echo "::error::Secret UPSTREAM_SYNC_TOKEN is missing. Add a fine-grained PAT with Contents, Pull requests and Workflows (read and write) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream into a review branch
        id: update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/CapSoftware/Cap.git
          git fetch upstream main
          git checkout -B chore/upstream-review origin/main

          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort
            echo "::error::Upstream has merge conflicts. Review manually; production was not modified."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            git push --force-with-lease origin HEAD:refs/heads/chore/upstream-review
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update review PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Prefer REST here: do not rely on gh pr list's GraphQL behavior.
          EXISTING_PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.head.ref == "chore/upstream-review")] | first | .number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updated existing upstream review PR #$EXISTING_PR"
            exit 0
          fi
          if ! gh pr create \
            --base main \
            --head chore/upstream-review \
            --title "chore: review upstream Cap updates" \
            --body "Automated upstream sync proposal from CapSoftware/Cap main. Review domain customizations, database migrations, Docker image/build and CI before merging. This does not deploy to production."; then
            echo "::error::Upstream review branch was updated, but GitHub blocked pull-request creation. Check that UPSTREAM_SYNC_TOKEN has Pull requests (read and write) on this repo and has not expired, or create a PR manually from chore/upstream-review into main."
            exit 1
          fi
